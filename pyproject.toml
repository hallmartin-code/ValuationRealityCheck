[project]
name = "ten-capital-valuation-analyzer"
version = "0.1.0"
description = "Derive a defensible startup valuation range from a pitch deck and produce a one-page TEN Capital PDF."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "Flask>=3.0",
    "gunicorn>=22.0",
    "pdfplumber>=0.11",
    "Pillow>=10.4",
    "python-dotenv>=1.0",
    "python-pptx>=1.0",
    "reportlab>=4.2",
    "resend>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# The email body is a literal HTML skeleton with inline styles, because mail
# clients strip <style> blocks. Wrapping those lines would inject whitespace
# into rendered text, so the line limit is lifted for that file alone.
"app/mailer.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
